[tool.uv]
# This project is only resolved/locked for Linux on the cluster. This avoids
# unsatisfiable branches for other platforms (e.g., macOS) when CUDA wheels are pinned.
environments = ["sys_platform == 'linux'"]
# This project is only resolved/locked for Linux on the cluster. This avoids
# unsatisfiable branches for other platforms (e.g., macOS) when CUDA wheels are pinned.
[tool.uv.sources]
latent-diffusion = { path = ".", editable = true }
clip = { git = "https://github.com/openai/CLIP.git", rev = "ded190a052fdf4585bd685cee5bc96e0310d2c93" }

# Install CUDA-enabled PyTorch wheels from the official PyTorch index.
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ldm*", "scripts*"]