model:
  base_learning_rate: 5.0e-05
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    image_size: 64
    channels: 3
    cond_stage_trainable: true
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 3
        out_channels: 3
        model_channels: 224
        attention_resolutions:
        - 8
        - 4
        - 2
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_head_channels: 32
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 512
        use_checkpoint: true
        legacy: false
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 3
        ckpt_path: models/first_stage_models/kl-f4-umm/best.ckpt
        ddconfig:
          double_z: true
          z_channels: 3
          resolution: 256
          in_channels: 1
          out_ch: 1
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: ldm.modules.encoders.modules.BERTEmbedder
      params:
        n_embed: 512
        n_layer: 4
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 96
    num_workers: 64
    wrap: false
    train:
      target: ldm.data.ummdsa.UMMDSATrain
      params:
        metadata_path: data_vis/CNN_prediction_train_artery_filtered.csv
        size: 256
        transform:
          target: ldm.data.transform.create_transform_pipeline
          params:
            size: 256
            augmentation_config: null
    validation:
      target: ldm.data.ummdsa.UMMDSAValidation
      params:
        metadata_path: data_vis/CNN_prediction_val_artery_filtered.csv
        size: 256
        transform:
          target: ldm.data.transform.create_transform_pipeline
          params:
            size: 256
            augmentation_config: null
