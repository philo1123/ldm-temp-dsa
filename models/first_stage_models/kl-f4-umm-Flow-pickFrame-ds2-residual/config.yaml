model:
  base_learning_rate: 2.0e-05
  target: ldm.models.autoencoder_CMHeads.AutoencoderKL_CMHeads
  params:
    monitor: val/rec_loss
    embed_dim: 3
    ckpt_path: models/first_stage_models/kl-f4-umm-CMD-pickFrame/best.ckpt
    freeze_backbone: false
    motion_proj_dim: 8
    content_head_kind: pickframe
    pickframe_mode: choice
    motion_head_kind: flow
    motion_head_params:
      flow:
        code_dim: 8
        ds_factor: 2
        use_residual: true
        flow_scale_alpha: 3.0
        zero_init: true
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 5000001
        kl_weight: 1.0e-06
        disc_weight: 0.0
        disc_in_channels: 1
    ddconfig:
      double_z: true
      z_channels: 3
      resolution: 256
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 60
    wrap: false
    train:
      target: ldm.data.ummdsa_series.UMMDSASeriesTrain
      params:
        metadata_path: data_vis/CNN_prediction_train_series_8_series_segment_artery_filtered.csv
        size: 256
        transform:
          target: ldm.data.transform.create_transform_pipeline
          params:
            size: 256
            augmentation_config: null
    validation:
      target: ldm.data.ummdsa_series.UMMDSASeriesValidation
      params:
        metadata_path: data_vis/CNN_prediction_val_series_8_series_segment_artery_filtered.csv
        size: 256
        transform:
          target: ldm.data.transform.create_transform_pipeline
          params:
            size: 256
            augmentation_config: null
