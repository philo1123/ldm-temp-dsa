model:
  base_learning_rate: 2.0e-05
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: val/rec_loss
    embed_dim: 3
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 5000001
        kl_weight: 1.0e-06
        disc_weight: 0.0
        disc_in_channels: 1
    ddconfig:
      double_z: true
      z_channels: 3
      resolution: 256
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 20
    num_workers: 32
    wrap: true
    train:
      target: ldm.data.ummdsa.UMMDSATrain
      params:
        metadata_path: data_vis/CNN_prediction_train_artery_filtered.csv
        size: 256
        transform:
          target: ldm.data.transform.create_transform_pipeline
          params:
            size: 256
            augmentation_config: null
    validation:
      target: ldm.data.ummdsa.UMMDSAValidation
      params:
        metadata_path: data_vis/CNN_prediction_val_artery_filtered.csv
        size: 256
        transform:
          target: ldm.data.transform.create_transform_pipeline
          params:
            size: 256
            augmentation_config: null
