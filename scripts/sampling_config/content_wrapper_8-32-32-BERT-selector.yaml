content_model_config:
  target: ldm.models.diffusion.contentDSALDMWrapper.BertPromptContentDSALDMWrapper
  params:
    ldm_config: "models/ldm/umm_dsa_f4_cond_BERT/config.yaml"
    ckpt_path: "models/ldm/umm_dsa_f4_cond_BERT/best.ckpt"
    prompt_file: "scripts/sample_prompts.yaml"
    default_steps: 200
    default_eta: 0.0
motion_shape: [8, 32, 32]
selector_config:
  enabled: true
  bundle_path: scripts/umm_phase_CNN/predictions/dino_logreg/head.joblib
  device: cuda
  selector_batch_size: 128
  strategy:
    mode: threshold_then_topk
    score_threshold: 0.8
    fallback_topk: true
  budget:
    max_generate_multiplier: 3.0
    early_stop: true
  outputs:
    save_all_candidates: false
    write_scores_csv: true